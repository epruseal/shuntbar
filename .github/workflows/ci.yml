name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: make app
      - run: ditto -c -k --keepParent Shuntbar.app "Shuntbar-${{ github.ref_name }}.zip"
      - run: gh release create "${{ github.ref_name }}" "Shuntbar-${{ github.ref_name }}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
